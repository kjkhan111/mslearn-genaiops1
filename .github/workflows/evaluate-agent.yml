name: Evaluate Trail Guide Agent

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/agents/trail_guide_agent/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "cdf1e668-6729-46ad-8c4e-a7ac69404462"
          tenant-id: "4cfe372a-37a4-44f8-91b2-5faf34253c62"
          subscription-id: "e32289bc-cb81-4181-b6fb-1cec10dc458a"

      - name: Run evaluation
        id: run
        env:
          AZURE_AI_PROJECT_ENDPOINT: "https://ai-account-4b22ywzrl25re.services.ai.azure.com/api/projects/ai-project-dev64506906"
          MODEL_NAME: "gpt-5.1"

          AZURE_CLIENT_ID: "cdf1e668-6729-46ad-8c4e-a7ac69404462"
          AZURE_TENANT_ID: "4cfe372a-37a4-44f8-91b2-5faf34253c62"
          AZURE_SUBSCRIPTION_ID: "e32289bc-cb81-4181-b6fb-1cec10dc458a"

        run: |
          python src/evaluators/evaluate_agent.py > evaluation_results.txt 2>&1 || true
          cat evaluation_results.txt

          grep -q "Evaluation FAILED" evaluation_results.txt && exit 1 || exit 0

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const results = fs.readFileSync(
              'evaluation_results.txt',
              'utf8'
            );

            const reportUrl =
              '${{ steps.run.outputs.report_url }}' ||
              'Not available';

            const body = `## 🎯 Agent Evaluation Results

            Automated evaluation completed for Trail Guide Agent changes.

            <details>
            <summary>View Detailed Results</summary>

            \`\`\`
            ${results}
            \`\`\`

            </details>

            📊 [View full results in Azure AI Foundry Portal](${reportUrl})

            **Evaluation Criteria:**
            - Intent Resolution (score ≥ 3)
            - Relevance (score ≥ 3)
            - Groundedness (score ≥ 3)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });